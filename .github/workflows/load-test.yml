name: Load test (manual)
run-name: Load test - ${{ inputs.rooms }} rooms / ${{ inputs.seconds }}s

on:
  workflow_dispatch:
    inputs:
      base_url:
        description: "Game origin to test, including http:// or https://"
        required: true
        type: string
      rooms:
        description: "Rooms (two players per room)"
        required: true
        type: choice
        default: "5"
        options: ["5", "10", "20"]
      seconds:
        description: "Duration in seconds"
        required: true
        type: choice
        default: "60"
        options: ["60", "180", "300"]

permissions:
  contents: read

# Keep load runs sequential, including runs from different branches.
concurrency:
  group: frontiers-load-test
  cancel-in-progress: false

jobs:
  load:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      BASE_URL: ${{ inputs.base_url }}
      ROOMS: ${{ inputs.rooms }}
      TEST_SECONDS: ${{ inputs.seconds }}
      THINK_MS: "2000"
      RAMP_SECONDS: "5"

    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Validate parameters and record run
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          import os
          import re
          from datetime import datetime, timezone
          from pathlib import Path
          from urllib.parse import urlsplit

          origin = os.environ["BASE_URL"]
          if not re.fullmatch(r"https?://[^\s/?#@]+", origin):
              raise SystemExit("BASE_URL must be an exact origin without a path or credentials")
          parsed = urlsplit(origin)
          if not parsed.hostname:
              raise SystemExit("BASE_URL must include a hostname")
          parsed.port  # Validate a port if supplied.
          if os.environ["ROOMS"] not in {"5", "10", "20"}:
              raise SystemExit("Unsupported room count")
          if os.environ["TEST_SECONDS"] not in {"60", "180", "300"}:
              raise SystemExit("Unsupported duration")
          folder = Path("artifacts/load")
          folder.mkdir(parents=True, exist_ok=True)
          metadata = {key: os.environ[key] for key in (
              "BASE_URL", "ROOMS", "TEST_SECONDS", "THINK_MS", "RAMP_SECONDS",
              "GITHUB_SHA", "GITHUB_REF", "GITHUB_RUN_ID", "GITHUB_RUN_ATTEMPT")}
          metadata["prepared_at_utc"] = datetime.now(timezone.utc).isoformat()
          (folder / "run.json").write_text(json.dumps(metadata, indent=2) + "\n")
          PY

      - name: Run k6 from GitHub runner
        shell: bash
        run: |
          set -euo pipefail
          docker pull grafana/k6:2.3.0
          date -u +%FT%TZ > artifacts/load/started-at.txt
          docker run --rm --name frontiers-load-generator \
            --user "$(id -u):$(id -g)" \
            --mount "type=bind,src=$PWD/tests/load_game.js,dst=/scripts/load_game.js,readonly" \
            --mount "type=bind,src=$PWD/artifacts/load,dst=/results" \
            -e BASE_URL -e ROOMS -e SECONDS="$TEST_SECONDS" -e THINK_MS -e RAMP_SECONDS \
            -e REPORT=/results/summary.json \
            grafana/k6:2.3.0 --log-output=stdout run --quiet \
            /scripts/load_game.js 2>&1 | tee artifacts/load/console.txt

      - name: Save report and console output
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: load-test-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/load/
          if-no-files-found: warn
          retention-days: 14
